[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "24.22.2"

# Shared /api/* function URLs work on Netlify and Vercel.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/.netlify/functions/robots"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# BrowserRouter clean routes: send app pages to the SPA shell after function routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
