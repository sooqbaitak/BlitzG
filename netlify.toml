[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Shared /api/* function URLs work on Netlify and Vercel.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# HashRouter is used for all app routes; this fallback also makes direct entry safe.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
